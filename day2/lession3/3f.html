<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .link{
            color: rgb(0,113,133);
            transition: color .15s;
        }
        .link:hover{
            color: rgb(217, 110, 23);
        }
        .nike{
            font-size:30px;
            font-weight: bold;
        }
        .doll{
            color: rgb(0,118,0);
            font-weight: bold;
        }
        .add{
            background-color: rgb(255,216,20);
            padding: 8px 20px;
            border-radius: 20px;
            border:1px solid rgb(255,216,20);
            transition: opacity 0.15s;
        }
        .add:hover{
            /* background-color: rgb(255, 130, 20); */
            opacity: 0.7;
        }
        .add:active{
            background-color: rgb(255, 130, 20);
        }
        .buy{
            background-color: rgb(255,164,28);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgb(255,164,28);
            transition: background-color 0.15s,color 0.15s,border 0.15s;
        }
        .buy:hover{
            background-color: white;
            color :rgb(255,164,28);
            border:1px solid rgb(255,164,28);
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.in"target="_blank" class="link">Back to Amazon</a>
    <p class="nike">Nike Black Running Shoes</p>
    <p class="doll">$39 - in stock.</p>
    <p>Free delivery tmorrow</p>
    <button class="add">Add to Cart</button>
    <button class="buy">Buy now</button>
</body>
</html>
