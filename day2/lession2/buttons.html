<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: auto;
            padding: auto;
        }
        .subscribe-button{
            border-radius: 20px;
            height: 60px;
            width: 160px;
            cursor: pointer;
            border: 2px solid black;
            text-align: center;
            font-size: medium;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-bottom: auto;
            padding: 10px;
            background-color: tomato;
        }
        .join-button{
             border-radius: 20px;
            height: 60px;
            width: 160px;
            cursor: pointer;
            border: 2px solid black;
            text-align: center;
            font-size: medium;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-bottom: auto;
            padding: 10px;
            background-color: cadetblue;
        }
        .tweet-button{
             border-radius: 20px;
            height: 60px;
            width: 160px;
            cursor: pointer;
            border: 2px solid black;
            text-align: center;
            font-size: medium;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-bottom: auto;
            padding: 10px;
            background-color: crimson;
        }
        .tweet-button:hover{
            height: 80px;
        }
    </style>
</head>
<body>
    <button class="subscribe-button">subscirbe</button>
    <button class="join-button">join</button>
    <button class="tweet-button">tweet</button>
</body>
</html>
