<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .link{
            color: rgb(0,113,133);
        }
        .nike{
            font-size:30px;
            font-weight: bold;
        }
        .doll{
            color: rgb(0,118,0);
            font-weight: bold;
        }
        .add{
            background-color: rgb(255,216,20);
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
        }
        .buy{
            background-color: rgb(255,164,28);
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.in"target="_blank" class="link">Back to Amazon</a>
    <p class="nike">Nike Black Running Shoes</p>
    <p class="doll">$39 - in stock.</p>
    <p>Free delivery tmorrow</p>
    <button class="add">Add to Cart</button>
    <button class="buy">Buy now</button>
</body>
</html>
