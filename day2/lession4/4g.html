<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: auto;
            padding: auto;
        }
        .subscribe-button{
            border-radius: 20px;
            height: 60px;
            width: 160px;
            cursor: pointer;
            border: 2px solid black;
            text-align: center;
            font-size: medium;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-bottom: auto;
            margin-right: 20px;
            margin-left: 20px;
            padding: 10px;
            background-color: tomato;
            transition: opacity 0.15s;
        }
        .subscribe-button:hover{
            opacity: 0.8;
        }
        .subscribe-button:active{
            opacity: 0.2;
        }
        .join-button{
             border-radius: 20px;
            height: 60px;
            width: 160px;
            cursor: pointer;
            border: 2px solid black;
            text-align: center;
            font-size: medium;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-bottom: auto;
            padding: 10px;
            background-color: cadetblue;
            transition: background-color 0.15s,color 0.15s;
        }
        .join-button:hover{
            background-color: white;
            color: cadetblue;
            border: 1px solid cadetblue;
        }

        .join-button:active{
            opacity: 0.4;
        }
        .tweet-button{
             border-radius: 20px;
            /* height: 60px;
            width: 160px; */
            cursor: pointer;
            border: 2px solid black;
            text-align: center;
            font-size: medium;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-bottom: auto;
            padding: 18px 60px 18px 60px;
            background-color: rgb(220, 20, 60);
            transition: box-shadow 0.15s;
        }
        .tweet-button:hover{
             box-shadow: 5px 5px 10px rgba(28, 25, 25, 0.619);
        }
    </style>
</head>
<body>
    <button class="subscribe-button">subscirbe</button>
    <button class="join-button">join</button>
    <button class="tweet-button">tweet</button>
</body>
</html>
