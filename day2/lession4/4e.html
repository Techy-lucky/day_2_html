<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linkin{
            background-color: rgb(10,102,194);
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            color: white;
            transition: backgorund-color 0.15s;
        }
        .linkin:hover{
            background-color: rgb(10,132,184);
        }
        .save{
            border: 1px solid rgb(10,102,194);
            color: rgb(10,102,194);
            background-color: white;
            padding: 10px 20px;
            border-radius: 20px;
            transition: border 0.15s,background-color 0.15s;
        }
        .save:hover{
         border: 2px solid rgb(10,102,194);   
         background-color: rgba(10,102,194,0.2);
        }
    </style>
</head>
<body>
    <button class="linkin">Apply on comapny website</button>
    <button class="save">Save</button>
</body>
</html>
